spring.application.name=demo

# --- DML Runner Configuration ---
# Set to true to enable execution of DML from YAML at startup
# Disabled by default for safety
dml.enabled=true

# --- Oracle DataSource (example) ---
# Provide these when enabling the DML runner
spring.datasource.oracle.local.url=jdbc:oracle:thin:@//localhost:1521/ORCLPDB1

# Environment-specific overrides (use with --env=dev|qa|prod or --environment=dev|qa|prod)
# Oracle (dev)
spring.datasource.oracle.dev.url=jdbc:oracle:thin:@//dev-host:1521/DEVDB
# Oracle (prod)
spring.datasource.oracle.prod.url=jdbc:oracle:thin:@//prod-host:1521/PRODDB

# --- PostgreSQL DataSource (example) ---
# If YAML path contains 'postgres', these will be used unless overridden by CLI
spring.datasource.postgres.url=jdbc:postgresql://localhost:5432/postgres

# Environment-specific overrides
# Postgres (dev)
spring.datasource.postgres.dev.url=jdbc:postgresql://dev-host:5432/postgres
# Postgres (prod)
spring.datasource.postgres.prod.url=jdbc:postgresql://prod-host:5432/postgres

# Note: All spring.datasource usernames and passwords have been removed from this file.
# Provide credentials via CLI (e.g., --db.username=... --db.password=...) or environment variables at runtime.

# --- JDBC driver class names ---
# Grouped here for clarity; moved from vendor sections above
spring.datasource.oracle.driver-class-name=oracle.jdbc.OracleDriver
spring.datasource.postgres.driver-class-name=org.postgresql.Driver
